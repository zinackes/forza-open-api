  /v1/search:
    get:
      operationId: search
      summary: Recherche globale multi-ressources (autocomplete).
      description: >
        Recherche plein texte sur les ressources nommées (voitures, tracés,
        événements, PR stunts, constructeurs, packs DLC) en un seul appel.
        Pensé pour l'autocomplete d'un site ou d'un bot. Résultats bornés par
        limit (pas de pagination) ; kinds restreint les types cherchés.
      tags: [Search]
      x-ogen-operation-group: Search
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: q
          in: query
          required: true
          description: Terme de recherche (sous-chaîne, insensible à la casse).
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: kinds
          in: query
          description: Types de ressources à chercher (tous si absent).
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/SearchResultKind' }
        - name: limit
          in: query
          description: Nombre maximal de résultats.
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: Les résultats correspondants (groupés par type, nom croissant).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResultList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/changes:
