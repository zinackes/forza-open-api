      description: >
        Flux des changements du jeu de données (voiture ajoutée/modifiée, pack
        sorti, série publiée…), alimenté par les jobs d'ingestion. Donne aux
        clients un « what's new » et la base d'une synchro incrémentale.
        Plus récents d'abord.
      tags: [Changes]
      x-ogen-operation-group: Changes
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: resource
          in: query
          description: Filtre par type de ressource (car, dlc_pack, series…). Valeur libre, non figée au contrat.
          schema: { type: string }
        - name: action
          in: query
          description: Filtre par action.
          schema: { $ref: '#/components/schemas/ChangeAction' }
        - name: since
          in: query
          description: Ne renvoie que les changements postérieurs à cet instant.
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page de changements (plus récents d'abord).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    Game:
      name: game
      in: query
      required: true
      description: Jeu cible (obligatoire sur les ressources multi-jeux).
      schema: { $ref: '#/components/schemas/Game' }
    Page:
      name: page
      in: query
      description: Numéro de page (1-based).
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      description: Taille de page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    UpdatedSince:
      name: updated_since
      in: query
      description: >
        Ne renvoie que les éléments modifiés après cet instant (synchro
        incrémentale : un client ne re-télécharge que le delta).
      schema: { type: string, format: date-time }

  responses:
    BadRequest:
      description: Requête invalide.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Clé API absente ou invalide.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Ressource introuvable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Quota de rate-limit dépassé.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Game:
      type: string
      description: Identifiant du jeu.
      enum: [fh6, fh5]

    CarClass:
      type: string
      description: >
        Classe Performance Index. R (voitures track-focused) introduite en FH6 ;
        absente de FH5.
      enum: [D, C, B, A, S1, S2, X, R]

    Drivetrain:
      type: string
      description: Transmission.
      enum: [FWD, RWD, AWD]

    CarStats:
      type: object
      description: Statistiques de performance (échelle du jeu).
      properties:
        speed: { type: number }
        handling: { type: number }
        acceleration: { type: number }
        launch: { type: number }
        braking: { type: number }
        offroad: { type: number }
      additionalProperties: { type: number }

    Car:
      type: object
      required: [id, game, name, make, class, pi, drivetrain]
      examples:
        - id: fh6-mazda-rx7-1997
          game: fh6
          name: "1997 Mazda RX-7"
          make: Mazda
          model: RX-7
          year: 1997
          class: A
          pi: 800
          drivetrain: RWD
          bodyType: Coupe
          category: Retro Sports Cars
          valueCr: 45000
          obtainMethod: autoshow
      properties:
        id: { type: string }
        game: { $ref: '#/components/schemas/Game' }
        name: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: integer }
        class: { $ref: '#/components/schemas/CarClass' }
        pi: { type: integer, minimum: 100, maximum: 999 }
        drivetrain: { $ref: '#/components/schemas/Drivetrain' }
        stats: { $ref: '#/components/schemas/CarStats' }
        bodyType: { type: string }
        category: { type: string, description: Catégorie / division in-game (ex. "Modern Supercars"). Absente si non sourcée. }
        rarity: { type: string }
        valueCr: { type: integer, format: int64 }
        obtainMethod: { type: string }
        imageUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CarList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Car' }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }

    CarComparison:
      type: object
      description: >
        Comparaison de 2 à 3 voitures, alignées dans l'ordre des ids demandés.
        Chaque entrée est l'objet Car complet (PI, classe, transmission, stats).
      required: [items]
      properties:
        items:
          type: array
          minItems: 2
          maxItems: 3
          items: { $ref: '#/components/schemas/Car' }

    Manufacturer:
      type: object
      required: [game, name, carCount]
      properties:
        game: { $ref: '#/components/schemas/Game' }
        name: { type: string }
        country: { type: string }
        carCount:
          type: integer
          format: int64
          description: Nombre de voitures du constructeur pour le jeu (agrégat GROUP BY ; 0 si aucune).

    DlcKind:
      type: string
      description: Type de pack DLC.
      enum: [car_pass, expansion, standalone]

    DlcPack:
      type: object
      description: Pack DLC / extension (Car Pass, expansion, standalone).
      required: [id, game, name, kind]
      properties:
        id: { type: string }
        game: { $ref: '#/components/schemas/Game' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/DlcKind' }
        releasedAt:
          type: string
          format: date-time
          description: Date de sortie. Absente si pack annoncé mais pas encore sorti.
        description: { type: string }
        source: { type: string, description: Source propre de la donnée. }
        lastVerified: { type: string, format: date-time }

    Reward:
      type: object
      required: [id, atPercent, type, item]
      properties:
        id: { type: string }
        atPercent: { type: integer, minimum: 0, maximum: 100 }
        type: { type: string }
        item: { type: string }

    Challenge:
      type: object
      required: [id, scope, name, requirement]
      properties:
        id: { type: string }
        scope: { type: string }
        name: { type: string }
        requirement: { type: string }
        reward: { type: string }
        expiresAt: { type: string, format: date-time }

    Series:
      type: object
      required: [id, game, series, name, isCurrent]
      properties:
        id: { type: string }
        game: { $ref: '#/components/schemas/Game' }
        series: { type: integer }
        name: { type: string }
        season: { type: string }
        week: { type: integer }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        isCurrent: { type: boolean }
        rewards:
          type: array
          items: { $ref: '#/components/schemas/Reward' }
        challenges:
          type: array
          items: { $ref: '#/components/schemas/Challenge' }

    Region:
      type: string
      description: >
        Région de la carte (dépend du jeu ; FH6 = 7 régions / 74 districts).
        Valeur libre : l'ensemble n'est pas figé au contrat. Absente → champ omis.

    TrackType:
      type: string
      description: Catégorie de tracé.
      enum: [circuit, road, dirt, cross, street, touge, horizon_rush]

    Track:
      type: object
      description: Tracé indexé (fonde les leaderboards et la carte).
      required: [id, game, name, type]
      examples:
        - id: fh6-shibuya-circuit
          game: fh6
          name: Shibuya Circuit
          type: street
          region: Tokyo
          lengthM: 2400
      properties:
        id: { type: string }
        game: { $ref: '#/components/schemas/Game' }
        name: { type: string }
        type: { $ref: '#/components/schemas/TrackType' }
        region: { $ref: '#/components/schemas/Region' }
        lengthM: { type: integer, description: Longueur en mètres. }
        surfaceMix: { type: string, description: Répartition des surfaces (texte libre). }
        startLat: { type: number, format: double }
        startLng: { type: number, format: double }
        source: { type: string, description: Source propre de la donnée. }
        lastVerified: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TrackList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Track' }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }

    PRStuntType:
      type: string
      description: Type de PR Stunt (épreuve de bord de route).
      enum: [speed_trap, speed_zone, drift_zone, danger_sign]

    PRStunt:
      type: object
      description: PR Stunt (speed trap, speed zone, drift zone, danger sign).
      required: [id, game, type, name]
      properties:
        id: { type: string }
        game: { $ref: '#/components/schemas/Game' }
        type: { $ref: '#/components/schemas/PRStuntType' }
        name: { type: string }
        region: { $ref: '#/components/schemas/Region' }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        targetScore: { type: integer, description: Score cible (3 étoiles) si connu. }

    PRStuntList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PRStunt' }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }

    EventType:
      type: string
      description: >
        Type d'événement / course. showcase = Horizon Showcase (événement
        scénarisé one-shot, voiture imposée).
      enum: [circuit, road, dirt, cross, street, touge_battle, horizon_rush, drag_meet, time_attack, showcase]

    Event:
      type: object
      description: Événement / course (route fixe ou circuit).
      required: [id, game, name, type]
      properties:
        id: { type: string }
        game: { $ref: '#/components/schemas/Game' }
        name: { type: string }
        type: { $ref: '#/components/schemas/EventType' }
        region: { $ref: '#/components/schemas/Region' }
        startLat: { type: number, format: double }
        startLng: { type: number, format: double }
        endLat: { type: number, format: double }
        endLng: { type: number, format: double }
        routeGeojson:
          type: object
          additionalProperties: true
          description: Tracé GeoJSON (LineString) si disponible.
        carClassRestriction: { type: string }
        lengthM: { type: integer }

    EventList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }

    BarnFind:
      type: object
      description: >
        Barn Find FH6 : épave cachée à localiser dans une zone de recherche, puis
        à restaurer. Déblocage progressif via les stamps Discover Japan
        (prerequisiteStampLevel 1-7 : Visitor, Sightseer, Traveller, Pathfinder,
        Navigator, Adventurer, Master Explorer). Mécanique distincte des
        Treasure Cars. Coordonnées NULL si non sourcées (datasets communautaires).
      required: [id, game, carId]
      properties:
        id: { type: string }
        game: { $ref: '#/components/schemas/Game' }
        carId: { type: string, description: Identifiant de la voiture obtenue (réf. /v1/cars). }
        region: { $ref: '#/components/schemas/Region' }
        searchZoneCenterLat: { type: number, format: double, description: Latitude du centre de la zone de recherche. }
        searchZoneCenterLng: { type: number, format: double, description: Longitude du centre de la zone de recherche. }
        searchZoneRadiusM: { type: integer, description: Rayon de la zone de recherche (mètres). }
        prerequisiteStampLevel:
          type: integer
          minimum: 1
          maximum: 7
          description: >
            Niveau de stamp Discover Japan requis pour débloquer ce Barn Find
            (1=Visitor, 2=Sightseer, 3=Traveller, 4=Pathfinder, 5=Navigator,
            6=Adventurer, 7=Master Explorer).
        restorationTimeH: { type: integer, description: Durée de restauration (heures de jeu). }
        source: { type: string, description: Source propre de la donnée. }
        lastVerified: { type: string, format: date-time }

    BarnFindList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BarnFind' }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }

    TreasureCar:
      type: object
      description: >
        Treasure Car FH6 : voiture associée à une postcard, conduisible
        immédiatement après la cutscene de lavage. Mécanique distincte des
        Barn Finds (pas de stamp ni de restauration). Coordonnées NULL si non
        sourcées (l'indice de la postcard suffit à localiser in-game).
      required: [id, game, carId]
      properties:
        id: { type: string }
        game: { $ref: '#/components/schemas/Game' }
        carId: { type: string, description: Identifiant de la voiture obtenue (réf. /v1/cars). }
        region: { $ref: '#/components/schemas/Region' }
        postcardClue: { type: string, description: Texte de l'indice (postcard) menant à la voiture. }
        locationLat: { type: number, format: double, description: Latitude de l'emplacement si sourcée. }
        locationLng: { type: number, format: double, description: Longitude de l'emplacement si sourcée. }
        source: { type: string, description: Source propre de la donnée. }
        lastVerified: { type: string, format: date-time }

    TreasureCarList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TreasureCar' }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }

    UpgradePartCategory:
      type: string
      description: Catégorie de pièce d'upgrade.
      enum: [engine, drivetrain, aspiration, tires, weight, aero, brakes, transmission, intake, exhaust, cooling, fuel_system]

    UpgradePart:
      type: object
      description: >
        Pièce du catalogue d'upgrade (générique, indépendante d'une voiture).
        Les deltas sont relatifs au palier inférieur ; NULL si non sourcés
        (précision > exhaustivité). Sourcing progressif : voitures populaires
        d'abord, extension par séries ensuite.
      required: [id, game, category, name]
      properties:
        id: { type: string }
        game: { $ref: '#/components/schemas/Game' }
        category: { $ref: '#/components/schemas/UpgradePartCategory' }
        name: { type: string }
        level:
          type: integer
          minimum: 1
          description: Palier de la pièce (1 = premier niveau). Omis si non applicable.
        piDelta: { type: integer, description: Variation de Performance Index apportée par la pièce. }
        weightDeltaKg: { type: integer, description: Variation de poids (kg). Négatif = allègement. }
        powerDeltaHp: { type: integer, description: Variation de puissance (ch). }
        torqueDeltaNm: { type: integer, description: Variation de couple (Nm). }
        source: { type: string, description: Source propre de la donnée. }
        lastVerified: { type: string, format: date-time }

    UpgradePartList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UpgradePart' }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }

    CarUpgrade:
      type: object
      description: >
        Upgrade disponible pour une voiture : une pièce du catalogue assortie de
        ses contraintes d'installation (prérequis, groupe exclusif).
      required: [part]
      properties:
        part: { $ref: '#/components/schemas/UpgradePart' }
        requiresPartId:
          type: string
          description: Pièce prérequise (réf. upgrade-parts) à monter avant celle-ci. Absent si aucune.
        exclusiveGroup:
          type: string
          description: >
            Groupe exclusif : une seule pièce d'un même groupe peut être montée
            à la fois (ex. compounds de pneus). Absent si non concerné.

    CarUpgradeList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CarUpgrade' }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }

    CarMasteryPerk:
      type: object
      description: >
        Perk de l'arbre Car Mastery FH6 : une case (row, col) de la grille 4×4 de
        la voiture, débloquée contre des Skill Points. Champs non sourcés → NULL
        (sourcing progressif : dataset forzagarage.com + wiki Fandom).
      required: [id, carId]
      properties:
        id: { type: string }
        carId: { type: string, description: Voiture propriétaire de l'arbre (réf. /v1/cars). }
        row: { type: integer, minimum: 1, maximum: 4, description: Ligne dans la grille (1-4). }
        col: { type: integer, minimum: 1, maximum: 4, description: Colonne dans la grille (1-4). }
        name: { type: string }
        spCost: { type: integer, description: Coût en Skill Points. }
        effectDescription: { type: string }
        effectType:
          type: string
          description: >
            Type d'effet (valeur libre). Courants : credits, xp_boost, wheelspin,
            super_wheelspin, skill_score, car_unlock.
        effectValue:
          type: integer
          description: Valeur de l'effet (montant de crédits ou pourcentage de boost selon le type).
        prereqPerkId: { type: string, description: Perk prérequise dans la grille. Absent si point d'entrée. }
        unlockedCarId:
          type: string
          description: >
            Voiture cachée débloquée par cette perk (effectType car_unlock ;
            réf. /v1/cars). Absent sinon.
        source: { type: string, description: Source propre de la donnée. }
        lastVerified: { type: string, format: date-time }

    JournalTrack:
      type: string
      description: Piste de progression du Collection Journal.
      enum: [horizon_festival, discover_japan]

    JournalTierColor:
      type: string
      description: >
        Couleur du wristband (track horizon_festival : Yellow → Gold sur 7
        niveaux). Absente pour les stamps Discover Japan.
      enum: [yellow, green, blue, pink, orange, purple, gold]

    JournalTier:
      type: object
      description: >
        Palier du Collection Journal FH6 : un niveau (1-7) d'une piste
        (horizon_festival = wristbands colorés Yellow → Gold ; discover_japan =
        stamps Visitor → Master Explorer). Atteint à pointsRequired points de
        collection. Peut débloquer une voiture (rewardCarId) et/ou du contenu
        (unlocksDescription : Legend Island + The Goliath, poussée des Barn
        Finds…). Remplace les Accolades de FH5. Champs non sourcés → omis.
      required: [id, game, track, level, name]
      properties:
        id: { type: string }
        game: { $ref: '#/components/schemas/Game' }
        track: { $ref: '#/components/schemas/JournalTrack' }
        level:
          type: integer
          minimum: 1
          maximum: 7
          description: Niveau du palier dans la piste (1-7).
        color: { $ref: '#/components/schemas/JournalTierColor' }
        name:
          type: string
          description: Nom du palier (couleur du wristband ou rang de stamp, ex. "Gold", "Master Explorer").
        pointsRequired:
          type: integer
          description: Points de collection requis pour atteindre le palier.
        rewardCarId:
          type: string
          description: Voiture débloquée par ce palier (réf. /v1/cars). Absent si le palier ne donne pas de voiture.
        unlocksDescription:
          type: string
          description: >
            Contenu débloqué par le palier (ex. "Legend Island + The Goliath",
            poussée des Barn Finds). Absent si non sourcé.
        source: { type: string, description: Source propre de la donnée. }
        lastVerified: { type: string, format: date-time }

    RefCount:
      type: object
      description: >
        Valeur d'une facette (code) et son nombre d'occurrences pour le jeu
        demandé. Pour les facettes énumérées (classes, drivetrains), tous les
        codes valides sont renvoyés, count compris à 0. Pour les facettes libres
        (bodyTypes, countries, categories), seules les valeurs présentes le sont.
      required: [code, count]
      properties:
        code: { type: string }
        count: { type: integer, format: int64 }

    GameCount:
      type: object
      description: Jeu disponible et ses volumes (voitures, séries de playlist).
      required: [code, countCars, countSeries]
      properties:
        code: { $ref: '#/components/schemas/Game' }
        countCars: { type: integer, format: int64 }
        countSeries: { type: integer, format: int64 }

    Reference:
      type: object
      description: >
        Facettes de référence pour amorcer les filtres d'un client. Les compteurs
        classes/drivetrains/bodyTypes/countries/categories sont scopés au `game`
        demandé ; games est global.
      required: [game, classes, drivetrains, bodyTypes, countries, categories, regions, trackTypes, eventTypes, prStuntTypes, obtainMethods, games]
      properties:
        game: { $ref: '#/components/schemas/Game' }
        classes:
          type: array
          description: Classes PI et leurs compteurs (ordre PI, R en dernier ; count 0 inclus).
          items: { $ref: '#/components/schemas/RefCount' }
        drivetrains:
          type: array
          description: Transmissions et leurs compteurs (count 0 inclus).
          items: { $ref: '#/components/schemas/RefCount' }
        bodyTypes:
          type: array
          description: Types de carrosserie présents (plus fréquents d'abord).
          items: { $ref: '#/components/schemas/RefCount' }
        countries:
          type: array
          description: Pays des constructeurs présents (plus fréquents d'abord).
          items: { $ref: '#/components/schemas/RefCount' }
        categories:
          type: array
          description: Catégories / divisions in-game présentes (plus fréquentes d'abord).
          items: { $ref: '#/components/schemas/RefCount' }
        regions:
          type: array
          description: >
            Régions présentes sur les ressources carte (count = tracés +
            événements + PR stunts de la région ; plus fréquentes d'abord).
            Évite aux clients carte de hardcoder la liste des régions.
          items: { $ref: '#/components/schemas/RefCount' }
        trackTypes:
          type: array
          description: Types de tracé et leurs compteurs (ordre canonique, count 0 inclus).
          items: { $ref: '#/components/schemas/RefCount' }
        eventTypes:
          type: array
          description: Types d'événement et leurs compteurs (ordre canonique, count 0 inclus).
          items: { $ref: '#/components/schemas/RefCount' }
        prStuntTypes:
          type: array
          description: Types de PR Stunt et leurs compteurs (ordre canonique, count 0 inclus).
          items: { $ref: '#/components/schemas/RefCount' }
        obtainMethods:
          type: array
          description: >
            Méthodes d'obtention (valeurs du paramètre obtain de /v1/cars) et
            leurs compteurs (ordre canonique, count 0 inclus). obtain_method
            étant multi-valeurs, une voiture compte dans chacune de ses méthodes.
          items: { $ref: '#/components/schemas/RefCount' }
        games:
          type: array
          description: Jeux disponibles et leurs volumes (global, indépendant du paramètre game).
          items: { $ref: '#/components/schemas/GameCount' }

    MetaGame:
      type: object
      description: >
        Volumes et fraîcheur des données d'un jeu supporté. carCount = voitures au
        catalogue (0 si rien n'est encore ingéré). catalogUpdatedAt /
        playlistUpdatedAt = dernier timestamp d'ingestion (journal data_changes)
        pour les ressources car / series ; absents si jamais ingéré pour ce jeu.
      required: [game, carCount]
      properties:
        game: { $ref: '#/components/schemas/Game' }
        carCount: { type: integer, format: int64 }
        catalogUpdatedAt:
          type: string
          format: date-time
          description: Dernière ingestion du catalogue (voitures) pour ce jeu. Absent si jamais ingéré.
        playlistUpdatedAt:
          type: string
          format: date-time
          description: Dernière ingestion de la playlist (séries) pour ce jeu. Absent si jamais ingérée.

    Meta:
      type: object
      description: >
        Métadonnées du service : jeux supportés, volumes et fraîcheur des données.
        Pensé pour les consommateurs (sélecteur de jeu, indicateur « data à
        jour ? ») et le dogfooding. games liste un MetaGame par valeur de l'enum
        Game (les jeux sans données apparaissent à 0).
      required: [games, generatedAt]
      properties:
        games:
          type: array
          description: Jeux supportés et leurs volumes / fraîcheur (un par valeur de l'enum Game).
          items: { $ref: '#/components/schemas/MetaGame' }
        dataVersion:
          type: string
          description: >
            Version du jeu de données publiée (tampon opérateur, ex. snapshot wiki
            daté). Absente si non renseignée.
        generatedAt:
          type: string
          format: date-time
          description: Instant de calcul de la réponse (permet d'estimer l'âge des données côté client).

    CarObtainMasteryUnlock:
      type: object
      description: >
        Perk Car Mastery d'une autre voiture qui débloque cette voiture
        (effectType car_unlock).
      required: [perkId, ownerCarId]
      properties:
        perkId: { type: string, description: "Identifiant de la perk (réf. /v1/cars/{id}/mastery)." }
        ownerCarId: { type: string, description: Voiture dont l'arbre contient la perk (réf. /v1/cars). }
        perkName: { type: string }

    CarObtain:
      type: object
      description: >
        Vue agrégée « comment obtenir cette voiture » : méthode du catalogue,
        prix, packs DLC, Barn Find, Treasure Car, paliers Journal et perks
        Car Mastery qui la débloquent. Listes vides / champs omis si la voie
        n'existe pas ou n'est pas sourcée (rien d'inventé).
      required: [carId, game, dlcPacks, journalTiers, masteryUnlocks]
      properties:
        carId: { type: string }
        game: { $ref: '#/components/schemas/Game' }
        obtainMethod: { type: string, description: Méthode d'obtention du catalogue (ex. autoshow, wheelspin). Absente si non sourcée. }
        valueCr: { type: integer, format: int64, description: Prix autoshow en crédits. Absent si non sourcé. }
        dlcPacks:
          type: array
          description: Packs DLC contenant la voiture (vide si aucun).
          items: { $ref: '#/components/schemas/DlcPack' }
        barnFind:
          $ref: '#/components/schemas/BarnFind'
          description: Barn Find donnant la voiture. Absent si la voiture n'en est pas un.
        treasureCar:
          $ref: '#/components/schemas/TreasureCar'
          description: Treasure Car donnant la voiture. Absente si la voiture n'en est pas une.
        journalTiers:
          type: array
          description: Paliers du Collection Journal qui récompensent la voiture (vide si aucun).
          items: { $ref: '#/components/schemas/JournalTier' }
        masteryUnlocks:
          type: array
          description: Perks Car Mastery (car_unlock) qui débloquent la voiture (vide si aucune).
          items: { $ref: '#/components/schemas/CarObtainMasteryUnlock' }

    SearchResultKind:
      type: string
      description: Type de ressource d'un résultat de recherche.
      enum: [car, track, event, pr_stunt, manufacturer, dlc_pack]

    SearchResult:
      type: object
      description: >
        Résultat de la recherche globale. id permet le lookup détaillé sur la
        ressource correspondante (pour manufacturer, id = nom du constructeur).
      required: [kind, id, game, name]
      examples:
        - kind: car
          id: fh6-mazda-rx7-1997
          game: fh6
          name: "1997 Mazda RX-7"
          detail: "Mazda · A 800"
      properties:
        kind: { $ref: '#/components/schemas/SearchResultKind' }
        id: { type: string }
        game: { $ref: '#/components/schemas/Game' }
        name: { type: string }
        detail:
          type: string
          description: >
            Contexte court d'affichage (ex. "Ford · A 800" pour une voiture,
            "circuit" pour un tracé). Absent si rien à ajouter.

    SearchResultList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }

    ChangeAction:
      type: string
      description: Action d'un changement de données.
      enum: [added, updated, removed]

    Change:
      type: object
      description: >
        Changement du jeu de données, enregistré par les jobs d'ingestion
        (ex. voiture ajoutée par le seed du catalogue).
      required: [id, game, resource, resourceId, action, occurredAt]
      examples:
        - id: 0196fdb2-aa11-7000-8000-000000000001
          game: fh6
          resource: car
          resourceId: fh6-mazda-rx7-1997
          action: added
          summary: "1997 Mazda RX-7"
          occurredAt: 2026-06-10T12:00:00Z
      properties:
        id: { type: string }
        game: { $ref: '#/components/schemas/Game' }
        resource: { type: string, description: Type de ressource (car, dlc_pack, series…). Valeur libre, non figée au contrat. }
        resourceId: { type: string, description: Identifiant de la ressource changée. }
        action: { $ref: '#/components/schemas/ChangeAction' }
        summary: { type: string, description: Description courte lisible (ex. nom de la voiture ajoutée). }
        occurredAt: { type: string, format: date-time }

    ChangeList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Change' }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }

    Story:
      type: object
      description: >
        Story FH6 : mission narrative de Discover Japan, rapporte des stamps au
        Collection Journal. Champs non sourcés → omis.
      required: [id, game, name]
      examples:
        - id: fh6-story-taxi-tales
          game: fh6
          name: Taxi Tales
          region: Tokyo
          chaptersCount: 8
      properties:
        id: { type: string }
        game: { $ref: '#/components/schemas/Game' }
        name: { type: string }
        region: { $ref: '#/components/schemas/Region' }
        description: { type: string }
        chaptersCount: { type: integer, minimum: 1, description: Nombre de chapitres. Absent si non sourcé. }
        rewardDescription: { type: string, description: Récompense de complétion (voiture, crédits…). Absente si non sourcée. }
        source: { type: string, description: Source propre de la donnée. }
        lastVerified: { type: string, format: date-time }

    StoryList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Story' }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }

    Tour:
      type: object
      description: >
        Tour FH6 (Tours of Japan) : visite guidée de l'activité Discovery,
        rapporte des stamps au Collection Journal. Champs non sourcés → omis.
      required: [id, game, name]
      properties:
        id: { type: string }
        game: { $ref: '#/components/schemas/Game' }
        name: { type: string }
        region: { $ref: '#/components/schemas/Region' }
        description: { type: string }
        source: { type: string, description: Source propre de la donnée. }
        lastVerified: { type: string, format: date-time }

    TourList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Tour' }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }

    Error:
      type: object
      description: Erreur au format RFC 9457 (application/problem+json).
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
