openapi: 3.1.0
info:
  title: Forza Open API
  version: 1.0.0
  description: >
    API REST ouverte, gratuite et communautaire pour les données Forza Horizon
    (FH6 d'abord, FH5 en backfill). Contract-first : ce fichier est la source de
    vérité ; le serveur Go (ogen) et les clients TS en découlent.
    Champ `game` partout (game-agnostic). Erreurs en RFC 9457.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://api.forza-open-api.org
    description: Production (placeholder — domaine à confirmer).
  - url: http://localhost:8080
    description: Développement local.

tags:
  - name: Cars
    description: Catalogue des voitures.
  - name: Manufacturers
    description: Constructeurs automobiles.
  - name: Playlist
    description: Festival Playlist (séries saisonnières, récompenses, défis).
  - name: Tracks
    description: Tracés / circuits indexés (fondation des leaderboards et de la carte).
  - name: PRStunts
    description: PR Stunts (speed trap, speed zone, drift zone, danger sign).
  - name: Events
    description: Événements / courses (routes fixes, circuits, drag meets…).
  - name: DLC
    description: Packs DLC / extensions (Car Pass, expansions, standalone).
  - name: BarnFinds
    description: Barn Finds (épaves cachées débloquées via les stamps Discover Japan, puis restaurées).
  - name: TreasureCars
    description: Treasure Cars (voitures liées aux postcards, conduisibles après la cutscene de lavage).
  - name: Upgrades
    description: Catalogue des pièces d'upgrade et upgrades disponibles par voiture.
  - name: Mastery
    description: Arbres Car Mastery (grille de perks par voiture).
  - name: Journal
    description: Collection Journal FH6 (Wristbands Horizon Festival + Stamps Discover Japan ; remplace les Accolades de FH5).
  - name: Reference
    description: Énumérations et compteurs agrégés (facettes) pour construire les filtres côté client.
  - name: Stories
    description: Stories FH6 (missions narratives Discover Japan ; rapportent des stamps au Collection Journal).
  - name: Tours
    description: Tours guidés (Tours of Japan) — activité Discovery FH6.
  - name: Search
    description: Recherche globale multi-ressources (autocomplete).
  - name: Changes
    description: Journal des changements de données (nouvelles voitures, packs, séries…).
  - name: Meta
    description: Métadonnées du service (jeux supportés, volumes, fraîcheur des données).

# Lecture publique possible ({}), clé optionnelle via X-API-Key.
security:
  - {}
  - ApiKeyAuth: []

paths:
  /v1/cars:
    get:
      operationId: listCars
      summary: Liste les voitures du catalogue.
      tags: [Cars]
      x-ogen-operation-group: Cars
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: ids
          in: query
          description: >-
            Restreint le résultat à une liste d'identifiants (CSV, ex.
            ids=audi-r8,ford-gt), bornée à 100. Les ids inconnus ou d'un autre
            jeu sont ignorés (pas d'erreur) ; total et pagination portent sur
            les correspondances.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items: { type: string }
        - name: make
          in: query
          description: Filtre par constructeur (ex. "Ford").
          schema: { type: string }
        - name: class
          in: query
          description: Filtre par classe PI.
          schema: { $ref: '#/components/schemas/CarClass' }
        - name: pi_min
          in: query
          description: Performance Index minimum (inclus).
          schema: { type: integer, minimum: 100, maximum: 999 }
        - name: pi_max
          in: query
          description: Performance Index maximum (inclus).
          schema: { type: integer, minimum: 100, maximum: 999 }
        - name: drivetrain
          in: query
          description: Filtre par transmission.
          schema: { $ref: '#/components/schemas/Drivetrain' }
        - name: category
          in: query
          description: Filtre par catégorie / division in-game (ex. "Modern Supercars"). Correspondance exacte.
          schema: { type: string }
        - name: q
          in: query
          description: Recherche plein texte sur name/model.
          schema: { type: string }
        - name: dlc
          in: query
          description: Filtre par pack DLC (identifiant d'un dlc_packs) ; liste les voitures du pack.
          schema: { type: string }
        - name: obtain
          in: query
          description: >-
            Filtre par méthode d'obtention. obtain_method est multi-valeurs
            (ex. "Autoshow, Wheelspin") : la correspondance se fait par token —
            obtain=wheelspin renvoie toute voiture dont l'une des méthodes est
            Wheelspin. Correspondances : autoshow → Autoshow ; wheelspin →
            Wheelspin ; wristband → Wristband reward / Yellow Wristband ;
            barn_find → Barn Find ; treasure → Treasure Car ; car_mastery →
            Car Mastery ; journal → Collection Journal ; car_pass → Car Pass ;
            hard_to_find → Hard to Find ; aftermarket → Aftermarket Car ;
            prologue → Complete the Prologue ; loyalty → Loyalty Reward ;
            preorder → Pre-order ; promotional → Promotional ; vip →
            VIP Membership ; welcome_pack → Welcome Pack ; unobtainable →
            Unobtainable. Les voitures de packs DLC se filtrent via `dlc`.
            Compteurs par valeur : facette `obtainMethods` de /v1/reference.
          schema:
            type: string
            enum: [autoshow, wheelspin, wristband, barn_find, treasure,
                   car_mastery, journal, car_pass, hard_to_find, aftermarket,
                   prologue, loyalty, preorder, promotional, vip, welcome_pack,
                   unobtainable]
        - $ref: '#/components/parameters/UpdatedSince'
        - name: sort
          in: query
          description: >-
            Tri du résultat : pi, name, year ou value (valeur en crédits).
            Préfixe "-" pour l'ordre décroissant (ex. sort=-pi).
            Défaut : pi croissant. Tri stable (départage par name puis id) ;
            les valeurs absentes (year/value NULL) sont renvoyées en dernier.
          schema:
            type: string
            enum: [pi, -pi, name, -name, year, -year, value, -value]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page de voitures.
          headers:
            Cache-Control:
              description: >-
                Cache long (catalogue quasi-statique). Revalidation conditionnelle
                via ETag / If-None-Match (304).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/cars/random:
    get:
      operationId: getRandomCar
      summary: Renvoie une voiture aléatoire satisfaisant les filtres.
      description: >
        Tire une seule voiture au hasard parmi celles qui satisfont les filtres
        (mêmes filtres optionnels que /v1/cars, hors q/dlc/ids/obtain/
        updated_since et pagination).
        Pensé pour les bots Discord
        ("bagnole random du jour"), défis communautaires et easter-eggs sur la
        landing. Réponse non cacheable (Cache-Control: no-store) : chaque appel
        re-tire. 404 si aucune voiture ne correspond.
      tags: [Cars]
      x-ogen-operation-group: Cars
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: make
          in: query
          description: Filtre par constructeur (ex. "Ford").
          schema: { type: string }
        - name: class
          in: query
          description: Filtre par classe PI.
          schema: { $ref: '#/components/schemas/CarClass' }
        - name: pi_min
          in: query
          description: Performance Index minimum (inclus).
          schema: { type: integer, minimum: 100, maximum: 999 }
        - name: pi_max
          in: query
          description: Performance Index maximum (inclus).
          schema: { type: integer, minimum: 100, maximum: 999 }
        - name: drivetrain
          in: query
          description: Filtre par transmission.
          schema: { $ref: '#/components/schemas/Drivetrain' }
        - name: category
          in: query
          description: Filtre par catégorie / division in-game (ex. "Modern Supercars"). Correspondance exacte.
          schema: { type: string }
      responses:
        '200':
          description: Une voiture tirée au hasard parmi les correspondances.
          headers:
            Cache-Control:
              description: Toujours no-store (tirage aléatoire, jamais mis en cache).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Car' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/cars/compare:
    get:
      operationId: compareCars
      summary: Compare 2 à 3 voitures côte à côte.
      description: >
        Renvoie les voitures demandées (2 à 3, via `ids`) dans l'ordre de la
        requête, pour un affichage côte à côte (overlays, bots Discord) : PI,
        classe, transmission et stats (vitesse/accélération/handling/freinage)
        sont alignés. Chaque entrée est l'objet Car complet. Comparaison
        stricte : 400 si moins de 2 ou plus de 3 ids ; 404 si un id est
        inconnu (contrairement au filtre `ids` de /v1/cars, aucun id n'est
        ignoré). L'id étant la clé stable globale, pas de paramètre `game`.
      tags: [Cars]
      x-ogen-operation-group: Cars
      parameters:
        - name: ids
          in: query
          required: true
          description: >-
            Identifiants des voitures à comparer (CSV, ex.
            ids=fh6-mazda-rx7-1997,fh6-toyota-supra-1998), 2 à 3 valeurs.
            L'ordre est conservé dans la réponse.
          style: form
          explode: false
          schema:
            type: array
            minItems: 2
            maxItems: 3
            items: { type: string }
      responses:
        '200':
          description: Les voitures demandées, alignées dans l'ordre des ids.
          headers:
            Cache-Control:
              description: >-
                Cache long (catalogue quasi-statique). Revalidation conditionnelle
                via ETag / If-None-Match (304).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarComparison' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/cars/{id}:
    get:
      operationId: getCar
      summary: Récupère une voiture par identifiant.
      tags: [Cars]
      x-ogen-operation-group: Cars
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant stable de la voiture.
          schema: { type: string }
      responses:
        '200':
          description: La voiture demandée.
          headers:
            Cache-Control:
              description: >-
                Cache long (catalogue quasi-statique). Revalidation conditionnelle
                via ETag / If-None-Match (304).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Car' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/cars/{id}/upgrades:
    get:
      operationId: listCarUpgrades
      summary: Liste les upgrades disponibles pour une voiture.
      description: >
        Pièces d'upgrade montables sur la voiture, avec leurs contraintes
        d'installation (prérequis, groupe exclusif). Le jeu est déterminé par la
        voiture (pas de paramètre game). Voiture inconnue ou sans upgrade
        sourcé → page vide.
      tags: [Upgrades]
      x-ogen-operation-group: Upgrades
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant stable de la voiture.
          schema: { type: string }
        - name: category
          in: query
          description: Filtre par catégorie de pièce.
          schema: { $ref: '#/components/schemas/UpgradePartCategory' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page d'upgrades disponibles pour la voiture.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarUpgradeList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/cars/{id}/mastery:
    get:
      operationId: getCarMastery
      summary: Arbre Car Mastery d'une voiture (grille de perks 4×4).
      description: >
        Perks de l'arbre Car Mastery FH6 de la voiture. Chaque perk occupe une
        case (row, col) de la grille 4×4, coûte des Skill Points (spCost), peut
        dépendre d'une autre (prereqPerkId) et certaines débloquent une voiture
        cachée (effectType car_unlock → unlockedCarId). Le jeu est déterminé par
        la voiture. Voiture inconnue ou arbre non sourcé → liste vide.
      tags: [Mastery]
      x-ogen-operation-group: Mastery
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant stable de la voiture.
          schema: { type: string }
      responses:
        '200':
          description: Les perks de l'arbre Car Mastery de la voiture.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CarMasteryPerk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/cars/{id}/obtain:
    get:
      operationId: getCarObtain
      summary: Vue agrégée « comment obtenir cette voiture ».
      description: >
        Agrège toutes les voies d'obtention connues d'une voiture : méthode du
        catalogue (autoshow, wheelspin…) + prix, packs DLC qui la contiennent,
        Barn Find, Treasure Car, paliers du Collection Journal qui la
        récompensent et perks Car Mastery (car_unlock) qui la débloquent.
        Sources absentes → listes vides / champs omis (rien d'inventé).
        404 si la voiture est inconnue.
      tags: [Cars]
      x-ogen-operation-group: Cars
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant stable de la voiture.
          schema: { type: string }
      responses:
        '200':
          description: Les voies d'obtention de la voiture.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarObtain' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/manufacturers:
    get:
      operationId: listManufacturers
      summary: Liste les constructeurs.
      tags: [Manufacturers]
      x-ogen-operation-group: Manufacturers
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: country
          in: query
          description: Filtre par pays du constructeur. Correspondance exacte.
          schema: { type: string }
        - name: q
          in: query
          description: Recherche plein texte sur le nom du constructeur.
          schema: { type: string }
      responses:
        '200':
          description: Liste des constructeurs pour le jeu.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Manufacturer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/reference:
    get:
      operationId: getReference
      summary: Énumérations et compteurs (facettes) pour les filtres clients.
      description: >
        Facettes agrégées pour construire les filtres d'un client en un seul
        appel : classes PI (incluant R en FH6), transmissions, types de
        carrosserie, pays des constructeurs et catégories (divisions in-game)
        — comptées pour le `game` demandé. La liste `games` est globale (volumes
        par jeu, indépendante du paramètre game) pour amorcer un sélecteur de
        jeu. Réponse fortement cacheable, invalidée par les jobs d'ingestion.
      tags: [Reference]
      x-ogen-operation-group: Reference
      parameters:
        - $ref: '#/components/parameters/Game'
      responses:
        '200':
          description: Facettes de référence pour le jeu.
          headers:
            Cache-Control:
              description: Politique de cache (réponse fortement cacheable, purgée à l'ingestion).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reference' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/meta:
    get:
      operationId: getMeta
      summary: "Métadonnées du service : jeux supportés, volumes et fraîcheur des données."
      description: >
        Métadonnées légères pour les consommateurs et le dogfooding : jeux
        supportés (fh6, fh5), nombre de voitures par jeu et derniers timestamps
        d'ingestion du catalogue et de la playlist. Les timestamps proviennent du
        journal d'ingestion (data_changes) : `catalogUpdatedAt` (ressource car) et
        `playlistUpdatedAt` (ressource series) sont absents si la ressource n'a
        jamais été ingérée pour le jeu (rien d'inventé). `dataVersion` porte la
        version de jeu de données publiée si l'opérateur l'a tamponnée.
        `generatedAt` = instant de calcul, pour estimer l'âge côté client.
        Réponse à cache court : la fraîcheur est l'objet même de l'endpoint.
      tags: [Meta]
      x-ogen-operation-group: Meta
      responses:
        '200':
          description: Métadonnées du service.
          headers:
            Cache-Control:
              description: Cache court (la donnée de fraîcheur doit rester quasi temps réel).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/dlc-packs:
    get:
      operationId: listDlcPacks
      summary: Liste les packs DLC / extensions d'un jeu.
      tags: [DLC]
      x-ogen-operation-group: DLC
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: kind
          in: query
          description: Filtre par type de pack.
          schema: { $ref: '#/components/schemas/DlcKind' }
      responses:
        '200':
          description: Les packs DLC connus pour le jeu (plus récents d'abord).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DlcPack' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/dlc-packs/{id}:
    get:
      operationId: getDlcPack
      summary: Récupère un pack DLC par identifiant.
      tags: [DLC]
      x-ogen-operation-group: DLC
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant stable du pack.
          schema: { type: string }
      responses:
        '200':
          description: Le pack demandé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DlcPack' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/playlist/current:
    get:
      operationId: getCurrentPlaylist
      summary: Festival Playlist courante d'un jeu.
      tags: [Playlist]
      x-ogen-operation-group: Playlist
      parameters:
        - $ref: '#/components/parameters/Game'
      responses:
        '200':
          description: La série courante avec ses récompenses et défis.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/playlist/series:
    get:
      operationId: listSeries
      summary: Liste les séries de Festival Playlist.
      tags: [Playlist]
      x-ogen-operation-group: Playlist
      parameters:
        - $ref: '#/components/parameters/Game'
      responses:
        '200':
          description: Les séries connues pour le jeu (récentes d'abord).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Series' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/playlist/series/{id}:
    get:
      operationId: getSeries
      summary: Récupère une série par identifiant.
      tags: [Playlist]
      x-ogen-operation-group: Playlist
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant stable de la série.
          schema: { type: string }
      responses:
        '200':
          description: La série demandée avec ses récompenses et défis.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/tracks:
    get:
      operationId: listTracks
      summary: Liste les tracés / circuits indexés.
      tags: [Tracks]
      x-ogen-operation-group: Tracks
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: type
          in: query
          description: Filtre par catégorie de tracé.
          schema: { $ref: '#/components/schemas/TrackType' }
        - name: region
          in: query
          description: Filtre par région.
          schema: { $ref: '#/components/schemas/Region' }
        - name: q
          in: query
          description: Recherche plein texte sur le nom du tracé.
          schema: { type: string }
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page de tracés.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/tracks/random:
    get:
      operationId: getRandomTrack
      summary: Renvoie un tracé aléatoire satisfaisant les filtres.
      description: >
        Tire un seul tracé au hasard parmi ceux qui satisfont les filtres
        (mêmes filtres optionnels que /v1/tracks, hors q et pagination).
        Pensé pour les bots Discord et défis communautaires (« course aléatoire
        du jour »). Réponse non cacheable (Cache-Control: no-store) : chaque
        appel re-tire. 404 si aucun tracé ne correspond.
      tags: [Tracks]
      x-ogen-operation-group: Tracks
      parameters:
        - $ref: '#/components/parameters/Game'
        - name: type
          in: query
          description: Filtre par catégorie de tracé.
          schema: { $ref: '#/components/schemas/TrackType' }
        - name: region
          in: query
          description: Filtre par région.
          schema: { $ref: '#/components/schemas/Region' }
      responses:
        '200':
          description: Un tracé tiré au hasard parmi les correspondances.
          headers:
            Cache-Control:
              description: Toujours no-store (tirage aléatoire, jamais mis en cache).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
