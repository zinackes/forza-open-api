# Stack de dev local : Postgres 18 (source de vérité) + Valkey (cache/rate-limit) + API.
# `task up` lève les trois services et attend qu'ils soient sains (/healthz 200).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: forza
      POSTGRES_PASSWORD: forza
      POSTGRES_DB: forza
    ports:
      - "${PG_HOST_PORT:-5432}:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      # PG18 : VOLUME = /var/lib/postgresql (PGDATA est dans un sous-dossier).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forza -d forza"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${VALKEY_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_ADDR: ":8080"
      # DSN internes au réseau compose (noms de services), pas les ports hôtes.
      DATABASE_URL: "postgres://forza:forza@postgres:5432/forza?sslmode=disable"
      REDIS_URL: "redis://valkey:6379/0"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      EXPORTS_DIR: /data/exports
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    volumes:
      # Archives générées par le scheduler (bind partagé) : l'API ne fait que les
      # servir en statique (/static/exports/*) → lecture seule.
      - ./data/exports:/data/exports:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      # Image distroless (sans shell/curl) : sonde via le binaire lui-même.
      test: ["CMD", "/api", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Cron interne (robfig/cron) : rafraîchit la Festival Playlist au reset Forza
  # (jeudi, fuseau UTC). Même image que l'API, ENTRYPOINT surchargé sur /scheduler.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/scheduler"]
    # uid hôte (dev) : l'image distroless tourne en nonroot (65532), qui ne peut
    # pas écrire dans le bind mount ./data/exports possédé par l'utilisateur hôte.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DATABASE_URL: "postgres://forza:forza@postgres:5432/forza?sslmode=disable"
      REDIS_URL: "redis://valkey:6379/0"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PLAYLIST_CRON: "${PLAYLIST_CRON:-0 15 * * 4}"
      PLAYLIST_GAMES: "${PLAYLIST_GAMES:-fh6}"
      FORZATHON_CRON: "${FORZATHON_CRON:-0 15 * * 4}"
      FORZATHON_GAMES: "${FORZATHON_GAMES:-fh6}"
      EXPORTS_CRON: "${EXPORTS_CRON:-0 5 * * *}"
      EXPORTS_GAMES: "${EXPORTS_GAMES:-fh6}"
      # Même chemin que l'API : le manifeste (table exports) pointe des URLs
      # /static/exports/* que l'API sert depuis ce bind partagé.
      EXPORTS_DIR: /data/exports
      EXPORTS_BASE_URL: "${EXPORTS_BASE_URL:-http://localhost:8080/static/exports}"
      ALERT_WEBHOOK_URL: "${ALERT_WEBHOOK_URL:-}"
    volumes:
      - ./data/exports:/data/exports
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
