version: '3'

# Charge .env s'il existe (ports hôtes, DSN locaux) ; sinon les défauts du
# code/compose s'appliquent. Voir .env.example.
dotenv: ['.env']

tasks:
  tidy:
    desc: Synchronise go.mod / go.sum
    cmds:
      - go mod tidy

  generate:
    desc: Génère le serveur depuis le contrat OpenAPI (ogen)
    cmds:
      - go generate ./...

  run:
    desc: Lance l'API en local
    cmds:
      - go run ./cmd/api

  build:
    desc: Compile le binaire API dans bin/
    cmds:
      - go build -o bin/api ./cmd/api

  test:
    desc: Lance la suite de tests
    cmds:
      - go test ./...

  vet:
    desc: go vet sur tout le module
    cmds:
      - go vet ./...

  lint:
    desc: Analyse statique (golangci-lint)
    cmds:
      - golangci-lint run

  spec-diff:
    desc: Signale les breaking changes du contrat vs une base git (oasdiff)
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
    cmds:
      # Lit le contrat de la base directement depuis git (réf:chemin) et le
      # compare au contrat de l'arbre de travail ; sortie != 0 sur un breaking.
      - go run github.com/oasdiff/oasdiff@v1.18.6 breaking {{.BASE}}:api/openapi.yaml api/openapi.yaml --fail-on ERR

  client:generate:
    desc: Régénère le SDK TS depuis le contrat (npm ci + openapi-typescript)
    dir: clients/ts
    cmds:
      - npm ci
      - npm run generate

  client:build:
    desc: Build le SDK TS (dist ESM + types)
    dir: clients/ts
    cmds:
      - npm run build

  client:check:
    desc: Typecheck du SDK TS + appel typé d'exemple
    dir: clients/ts
    cmds:
      - npm run check

  client:py:generate:
    desc: Régénère le SDK Python depuis le contrat (openapi-generator, image Docker pinnée)
    # Tourne depuis la racine : le conteneur monte $PWD et lit api/openapi.yaml.
    vars:
      GEN_VERSION: v7.22.0
      # info.version du contrat (source de vérité) -> packageVersion du paquet.
      PKG_VERSION:
        sh: grep -m1 -E '^  version:' api/openapi.yaml | sed -E 's/.*version:[[:space:]]*//'
    cmds:
      - >-
        docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/local -w /local
        openapitools/openapi-generator-cli:{{.GEN_VERSION}} generate
        -i api/openapi.yaml -g python -o clients/python
        -c clients/python/openapi-generator-config.yaml
        --additional-properties=packageVersion={{.PKG_VERSION}}

  client:py:check:
    desc: Installe le SDK Python dans un venv, smoke-import + typecheck de l'exemple
    dir: clients/python
    cmds:
      - python3 -m venv .venv
      - .venv/bin/python -m pip install --quiet --upgrade pip
      - .venv/bin/pip install --quiet . mypy
      - .venv/bin/python -c "import forza_open_api_client as c; print(c.__version__)"
      - .venv/bin/python -m mypy --cache-dir=.venv/.mypy_cache --follow-imports=silent examples/list_cars.py

  up:
    desc: Lève Postgres + Valkey + API et attend qu'ils soient sains (/healthz 200)
    cmds:
      - docker compose up -d --build --wait

  down:
    desc: Arrête et nettoie les services
    cmds:
      - docker compose down
