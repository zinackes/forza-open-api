name: CI

# Sur les PR (toute branche -> main) et sur push vers main (post-merge), pour
# qu'une PR ne déclenche qu'un seul run par job. Les jobs réutilisent les tasks
# du Taskfile (parité locale/CI) ; le cache des modules Go via actions/setup-go.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
        with:
          version: 3.x
      - run: task vet

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
        with:
          version: 3.x
      - run: task test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
        with:
          version: 3.x
      - run: task build

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
        with:
          version: 3.x
      # L'action installe golangci-lint (pinné + cache) sans le lancer ;
      # `task lint` exécute la même commande qu'en local.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
      - run: task lint

  spec-drift:
    name: spec-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
        with:
          version: 3.x
      # Le code généré doit toujours matcher le contrat : on régénère puis on
      # échoue si l'arbre de travail a bougé.
      - run: task generate
      - name: Verify generated code matches the contract
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code is out of sync with api/openapi.yaml. Run 'task generate' and commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

  spec-diff:
    name: spec-diff
    # Complète spec-drift (carte 0.5) : compare le contrat de la PR à sa base et
    # échoue sur tout breaking change non versionné. Un breaking volontaire se
    # livre en additif (/v2) ou, en review, via le label PR `spec-breaking-ok`.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'spec-breaking-ok')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # nécessaire pour lire le contrat de la base
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
        with:
          version: 3.x
      - run: task spec-diff BASE=origin/${{ github.base_ref }}

  client:
    name: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      - uses: go-task/setup-task@v2
        with:
          version: 3.x
      # Le SDK TS découle du contrat : on régénère src/schema.ts depuis le spec
      # et on échoue si l'arbre de travail a bougé (client désynchro du contrat).
      - run: task client:generate
      - name: Verify generated client matches the contract
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::TS client is out of sync with api/openapi.yaml. Run 'task client:generate' and commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
      # Le SDK + l'appel typé d'exemple doivent compiler contre le contrat.
      - run: task client:build
      - run: task client:check
