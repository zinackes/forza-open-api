name: release-client

# Publie le SDK TypeScript @forza-open-api/client sur npm.
# Déclenché par un tag `client-v<version>` (ex. client-v1.0.0) — préfixe dédié
# pour ne pas entrer en collision avec d'éventuels tags de release Go.
# La version est alignée sur le contrat (api/openapi.yaml) via sync-version ;
# le tag doit matcher cette version, sinon le job échoue.
on:
  push:
    tags:
      - 'client-v*'

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Aligne package.json sur info.version du contrat (source de vérité).
      - run: npm run sync-version
      - name: Verify tag matches the contract version
        run: |
          tag_version="${GITHUB_REF_NAME#client-v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} ne correspond pas à la version du contrat (${pkg_version}). Tague client-v${pkg_version}."
            exit 1
          fi
      - run: npm run generate
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
